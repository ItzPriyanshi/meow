<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow-DL - Uptime</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" href="https://i.ibb.co/5WMp4cYZ/image.jpg" type="image/jpg">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="https://i.ibb.co/5WMp4cYZ/image.jpg" alt="Meow-DL Logo" class="logo">
            <div class="logo-animation"></div>
        </div>
        <div class="header-content">
            <h1 class="shining-text">Meow-DL</h1>
            <p>Uptime & Statistics</p>
            <nav>
                <a href="/home.html" class="nav-button">Home</a>
                <a href="/dashboard.html" class="nav-button">Dashboard</a>
            </nav>
        </div>
    </header>
    <main class="uptime-main">
        <section class="uptime-stats">
            <h2>Website & API Uptime</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <h4>Website Uptime</h4>
                    <p><span id="website-uptime">99.9%</span></p>
                </div>
                <div class="stat-card">
                    <h4>Total API Requests</h4>
                    <p><span id="total-requests">Loading...</span></p>
                </div>
                <div class="stat-card">
                    <h4>Average Ping</h4>
                    <p><span id="avg-ping">Loading...</span></p>
                </div>
                <div class="stat-card">
                    <h4>Last Downtime</h4>
                    <p><span id="last-downtime">None</span></p>
                </div>
            </div>
        </section>
        <section class="api-usage-chart">
            <h2>API Usage Status</h2>
            <div class="usage-chart-placeholder">
                <p>Chart coming soon!</p>
            </div>
        </section>
    </main>
    <footer>
        <div class="social-links">
            <a href="https://m.facebook.com/OGPriyanshiKaurJi" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook">
            </a>
            <a href="https://github.com/MeowGurl" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg" alt="GitHub">
            </a>
            <a href="https://t.me/PriyanshiKaurJi" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram">
            </a>
            <a href="mailto:priyanshikaurji@gmail.com">
                <img src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Gmail_icon_%282020%29.svg" alt="Email">
            </a>
        </div>
        <p>&copy; 2024 Meow-DL. All rights reserved.</p>
    </footer>
    <script src="/script.js"></script>
</body>
</html>
