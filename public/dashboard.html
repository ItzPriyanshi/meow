<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | Meow-DL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <div class="logo-wrap-sm"><img src="https://i.ibb.co/5WMp4cYZ/image.jpg" class="logo-circular small"></div>
    <h2 class="shine">Dashboard</h2>
    <p class="description">APIs Available & Latency</p>
    <div class="dashboard-table">
      <table>
        <thead>
          <tr><th>API</th><th>Status</th><th>Latency</th></tr>
        </thead>
        <tbody id="api-status">
        </tbody>
      </table>
    </div>
    <a href="/home.html" class="back-btn">Home</a>
  </div>
  <script src="/theme.js"></script>
  <script>
    async function fetchStatus(){
      const apis = ['YouTube','Instagram','Facebook','Pinterest','TikTok','X','Picsart Upscaler'];
      const rows = apis.map(api=>{
        return `<tr>
          <td>${api}</td>
          <td class="api-status running">Running</td>
          <td class="api-latency" id="lat-${api.replace(/\W/g,'').toLowerCase()}">- ms</td>
        </tr>`
      }).join('');
      document.getElementById('api-status').innerHTML = rows;
      const latency = Math.floor(Math.random()*100)+20;
      apis.forEach(api=>{
        document.getElementById('lat-'+api.replace(/\W/g,'').toLowerCase()).innerText = (latency+Math.floor(Math.random()*50)) + ' ms';
      });
    }
    window.onload = fetchStatus;
  </script>
</body>
</html>
