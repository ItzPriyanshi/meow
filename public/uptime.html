<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meow-DL - Uptime</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <img src="https://i.ibb.co/5WMp4cYZ/image.jpg" alt="Meow-DL Logo" class="logo" />
    <h1 class="shining-text">Meow-DL</h1>
    <nav>
      <a href="/" class="nav-button">Home</a>
      <a href="/dashboard" class="nav-button">Dashboard</a>
    </nav>
  </header>
  <main>
    <section class="uptime-section">
      <h2>API Usage Status & Website Uptime</h2>
      <ul class="uptime-list" id="uptime-list">
        <li>Loading status...</li>
      </ul>
      <p class="ping-info" id="ping-info">Pinging server...</p>
      <p class="uptime-info" id="uptime-info">Uptime: Loading...</p>
    </section>
  </main>
  <footer>
    <div class="social-icons">
      <a href="https://m.facebook.com/OGPriyanshiKaurJi" target="_blank" aria-label="Facebook" class="icon facebook"></a>
      <a href="https://github.com/MeowGurl" target="_blank" aria-label="GitHub" class="icon github"></a>
      <a href="https://t.me/PriyanshiKaurJi" target="_blank" aria-label="Telegram" class="icon telegram"></a>
      <a href="mailto:priyanshikaurji@gmail.com" aria-label="Email" class="icon email"></a>
    </div>
  </footer>
  <script>
    const apiPaths = [
      { name: 'Instagram', path: '/insta' },
      { name: 'Facebook', path: '/fb' },
      { name: 'Pinterest', path: '/pin' },
      { name: 'TikTok', path: '/tt' },
      { name: 'X (Twitter)', path: '/x' },
      { name: 'Picsart Upscaler', path: '/pp' }
    ];

    async function checkApiStatus(path) {
      try {
        const res = await fetch(path);
        return res.ok;
      } catch {
        return false;
      }
    }

    async function updateUptimeStatus() {
      const list = document.getElementById('uptime-list');
      list.innerHTML = '';

      for (const api of apiPaths) {
        const status = await checkApiStatus(api.path);
        const li = document.createElement('li');
        li.textContent = `${api.name}: ${status ? 'Online' : 'Offline'}`;
        li.style.color = status ? '#4caf50' : '#f44336';
        list.appendChild(li);
      }
    }

    async function pingServer() {
      const pingElement = document.getElementById('ping-info');
      const start = performance.now();
      try {
        const res = await fetch('/');
        if (!res.ok) throw new Error('Ping failed');
        const end = performance.now();
        pingElement.textContent = `Ping: ${(end - start).toFixed(0)} ms`;
      } catch {
        pingElement.textContent = 'Ping failed';
      }
    }

    function formatDuration(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      return `${h}h ${m}m ${s}s`;
    }

    async function updateUptimeInfo() {
      if (window.performance && performance.timing) {
        // Using performance API for uptime approximation
        const uptimeSeconds = (Date.now() - performance.timing.navigationStart) / 1000;
        document.getElementById('uptime-info').textContent = 'Uptime: ' + formatDuration(uptimeSeconds);
      } else {
        document.getElementById('uptime-info').textContent = 'Uptime info unavailable';
      }
    }

    async function refreshAll() {
      await updateUptimeStatus();
      await pingServer();
      updateUptimeInfo();
    }

    refreshAll();
    setInterval(refreshAll, 30000);
  </script>
</body>
</html>
