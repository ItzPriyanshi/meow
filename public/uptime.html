<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Uptime | Meow-DL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <div class="logo-wrap-sm"><img src="https://i.ibb.co/5WMp4cYZ/image.jpg" class="logo-circular small"></div>
    <h2 class="shine">Uptime</h2>
    <p class="description">APIs Usage Status & Website Uptime</p>
    <div class="dashboard-table">
      <table>
        <thead>
          <tr><th>API</th><th>Usage Status</th><th>Website Uptime</th><th>Ping</th></tr>
        </thead>
        <tbody id="uptime-status">
        </tbody>
      </table>
    </div>
    <a href="/home.html" class="back-btn">Home</a>
  </div>
  <script src="/theme.js"></script>
  <script>
    async function fetchUptime(){
      const apis = ['YouTube','Instagram','Facebook','Pinterest','TikTok','X','Picsart Upscaler'];
      const up = 'Online';
      const ut = (Math.random()*99.9+0.1).toFixed(2)+'%';
      const ping = Math.floor(Math.random()*50)+18;
      const rows = apis.map(api=>{
        return `<tr>
          <td>${api}</td>
          <td class="api-status running">${up}</td>
          <td class="api-uptime">${ut}</td>
          <td class="api-ping">${ping+Math.floor(Math.random()*30)} ms</td>
        </tr>`;
      }).join('');
      document.getElementById('uptime-status').innerHTML = rows;
    }
    window.onload = fetchUptime;
  </script>
</body>
</html>
