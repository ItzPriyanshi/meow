<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meow-DL - Dashboard</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <img src="https://i.ibb.co/5WMp4cYZ/image.jpg" alt="Meow-DL Logo" class="logo" />
    <h1 class="shining-text">Meow-DL</h1>
    <nav>
      <a href="/" class="nav-button">Home</a>
      <a href="/uptime" class="nav-button">Uptime</a>
    </nav>
  </header>
  <main>
    <section class="dashboard-section">
      <h2>APIs Available</h2>
      <ul id="api-list" class="api-list">
        <!-- API status & latency will be populated here by script -->
      </ul>
    </section>
  </main>
  <footer>
    <div class="social-icons">
      <a href="https://m.facebook.com/OGPriyanshiKaurJi" target="_blank" aria-label="Facebook" class="icon facebook"></a>
      <a href="https://github.com/MeowGurl" target="_blank" aria-label="GitHub" class="icon github"></a>
      <a href="https://t.me/PriyanshiKaurJi" target="_blank" aria-label="Telegram" class="icon telegram"></a>
      <a href="mailto:priyanshikaurji@gmail.com" aria-label="Email" class="icon email"></a>
    </div>
  </footer>
  <script>
    const apis = [
      { name: 'Instagram', path: '/insta' },
      { name: 'Facebook', path: '/fb' },
      { name: 'Pinterest', path: '/pin' },
      { name: 'TikTok', path: '/tt' },
      { name: 'X (Twitter)', path: '/x' },
      { name: 'Picsart Upscaler', path: '/pp' }
    ];

    async function checkApiLatency(path) {
      const start = performance.now();
      try {
        const res = await fetch(path);
        if (!res.ok) throw new Error('API call failed');
        const end = performance.now();
        return (end - start).toFixed(0);
      } catch {
        return null;
      }
    }

    async function updateApiList() {
      const list = document.getElementById('api-list');
      for (const api of apis) {
        const latency = await checkApiLatency(api.path);
        const li = document.createElement('li');
        li.textContent = api.name + ' - Latency: ' + (latency ? latency + ' ms' : 'Unavailable');
        list.appendChild(li);
      }
    }

    updateApiList();
  </script>
</body>
</html>
